name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-mono

      - name: Install Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot /tmp/templates
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          target=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "${target}"
          mv /tmp/templates/templates/* "${target}/"

      - name: Locate Godot
        run: |
          godot="$(find ~/godot -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          chmod +x "${godot}"
          echo "GODOT=${godot}" >> "${GITHUB_ENV}"

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^application\/(short_version|version)=.*/application\/\1=\"${version}\"/" export_presets.cfg
          sed -i -E "s/^application\/(file_version|product_version)=.*/application\/\1=\"${version}.0\"/" export_presets.cfg

      - name: Build and import
        run: |
          dotnet build IdleBar.csproj -c Release
          "${GODOT}" --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p build/windows
          "${GODOT}" --headless --path . --export-release "Windows" build/windows/IdleBar.exe
          test -f build/windows/IdleBar.exe

      - name: Export macOS
        run: |
          mkdir -p build/macos
          "${GODOT}" --headless --path . --export-release "macOS" build/macos/IdleBar.zip
          test -f build/macos/IdleBar.zip

      - name: Package
        run: |
          (cd build/windows && zip -qr "../IdleBar-${GITHUB_REF_NAME}-windows.zip" .)
          cp build/macos/IdleBar.zip "build/IdleBar-${GITHUB_REF_NAME}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: IdleBar-${{ github.ref_name }}
          path: build/IdleBar-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/IdleBar-*.zip
          generate_release_notes: true